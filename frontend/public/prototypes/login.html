<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "tertiary-fixed": "#ffdad6", "surface-container-low": "#f4f4f0", "text-primary": "#172a3a", "inverse-surface": "#2f312e", "secondary-container": "#9f8eff", "on-tertiary-fixed": "#410003", "surface-dim": "#dbdad6", "error-container": "#ffdad6", "yellow-warning": "#f4c95d", "secondary": "#5f4dba", "dark-bg": "#0f1720", "secondary-fixed-dim": "#c9bfff", "dark-surface": "#172a3a", "inverse-on-surface": "#f2f1ed", "text-muted": "#98a2b3", "tertiary-container": "#590005", "background": "#faf9f5", "surface-container-highest": "#e3e2df", "on-tertiary-container": "#e7685f", "surface-container-high": "#e9e8e4", "outline-variant": "#c3c7cc", "tertiary-fixed-dim": "#ffb3ac", "surface-bright": "#faf9f5", "border-light": "#eaecf0", "on-primary-fixed": "#091d2d", "surface-white": "#ffffff", "on-secondary-fixed-variant": "#4733a1", "on-background": "#1b1c1a", "surface-variant": "#e3e2df", "on-error-container": "#93000a", "mint-success": "#62d2a2", "on-secondary": "#ffffff", "outline": "#74777d", "surface": "#faf9f5", "text-disabled": "#d0d5dd", "secondary-fixed": "#e5deff", "on-primary": "#ffffff", "surface-tint": "#4e6072", "on-error": "#ffffff", "primary": "#021525", "on-tertiary-fixed-variant": "#86211e", "primary-fixed": "#d1e5fa", "primary-container": "#172a3a", "on-tertiary": "#ffffff", "primary-fixed-dim": "#b5c9de", "inverse-primary": "#b5c9de", "error": "#ba1a1a", "on-surface": "#1b1c1a", "on-primary-fixed-variant": "#36495a", "tertiary": "#320002", "text-secondary": "#667085", "on-primary-container": "#7e91a5", "on-secondary-fixed": "#1a0063", "on-surface-variant": "#43474c", "on-secondary-container": "#341d8e", "surface-container-lowest": "#ffffff", "surface-container": "#efeeea" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "space-2xl": "2rem", "margin-mobile": "1rem", "space-md": "1rem", "gutter": "1rem", "margin": "1.5rem", "gutter-mobile": "0.75rem", "space-xl": "1.5rem", "space-xs": "0.5rem", "space-lg": "1.25rem", "space-sm": "0.75rem", "space-3xl": "3rem", "space-2xs": "0.25rem" }, fontFamily: { "label-md": ["Inter"], "caption-caps": ["Plus Jakarta Sans"], "headline-lg": ["Plus Jakarta Sans"], "body-lg": ["Inter"], "body-md": ["Inter"], "display-lg": ["Plus Jakarta Sans"], "display-lg-mobile": ["Plus Jakarta Sans"], "headline-md": ["Plus Jakarta Sans"], "body-lg-medium": ["Inter"], "body-md-medium": ["Inter"], "headline-sm": ["Plus Jakarta Sans"], "caption": ["Inter"] }, fontSize: { "label-md": ["13px", { lineHeight: "18px", letterSpacing: "0.01em", fontWeight: "600" }], "caption-caps": ["11px", { lineHeight: "14px", letterSpacing: "0.06em", fontWeight: "700" }], "headline-lg": ["24px", { lineHeight: "32px", letterSpacing: "-0.015em", fontWeight: "700" }], "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }], "body-md": ["14px", { lineHeight: "20px", fontWeight: "400" }], "display-lg": ["32px", { lineHeight: "40px", letterSpacing: "-0.02em", fontWeight: "700" }], "display-lg-mobile": ["26px", { lineHeight: "32px", letterSpacing: "-0.02em", fontWeight: "700" }], "headline-md": ["20px", { lineHeight: "28px", letterSpacing: "-0.01em", fontWeight: "600" }], "body-lg-medium": ["16px", { lineHeight: "24px", fontWeight: "500" }], "body-md-medium": ["14px", { lineHeight: "20px", fontWeight: "500" }], "headline-sm": ["18px", { lineHeight: "24px", fontWeight: "600" }], "caption": ["12px", { lineHeight: "16px", fontWeight: "500" }] } } } };</script><style>@layer base{html,body{width:100%;margin:0;padding:0;background-color:#faf9f5;}body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent;}.pb-safe{padding-bottom:max(env(safe-area-inset-bottom,0px),1rem);}.pt-safe{padding-top:max(env(safe-area-inset-top,0px),1rem);}}::-webkit-scrollbar{display:none;}</style></head><body class="bg-surface font-body-md text-on-surface min-h-screen flex flex-col antialiased selection:bg-secondary-fixed"><main class="flex-1 flex flex-col relative w-full pt-safe pb-safe bg-surface"><div class="flex flex-col w-full px-margin-mobile pb-space-2xl">
<!-- Subtle Ambient Glow -->
<div class="relative w-full max-w-md mx-auto">
<div class="absolute -top-10 left-1/2 -translate-x-1/2 w-48 h-48 bg-secondary-fixed/50 rounded-full blur-3xl pointer-events-none -z-10"></div>
<!-- Header Section with Logo & Warm Delight -->
<div class="flex flex-col items-center text-center mt-space-sm mb-space-lg"><h1 class="font-display-lg text-display-lg text-text-primary tracking-tight font-extrabold">KUDO APP</h1><p class="font-body-md text-body-md text-text-secondary mt-2 max-w-xs">Organiza tus ingresos, gastos y metas financieras en un solo lugar.</p></div>
<!-- Main Card Container -->
<div class="bg-surface-white rounded-xl shadow-xl p-space-lg flex flex-col gap-space-md">
<style>.category-picker{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0}.category-option{border:1px solid #e7e3ee;border-radius:12px;padding:11px 9px;background:#fff;color:#514b60;text-align:left;font:600 12px Inter,sans-serif;transition:.15s}.category-option:hover{border-color:#a18be2;background:#faf8ff}.category-option.selected{border-color:#7555d9;background:#f1edfc;color:#4f38a5;box-shadow:0 0 0 2px #7555d91a}.category-option:focus-visible{outline:3px solid #7555d955;outline-offset:2px}@media(max-width:380px){.category-picker{grid-template-columns:1fr}}</style>
<!-- Interactive Tab Switcher -->
<div class="relative bg-surface-container-low p-1 rounded-lg flex items-center">
<button class="relative z-10 flex-1 py-2 text-center font-label-md text-label-md rounded-md transition-all duration-200 text-on-primary bg-primary shadow-sm" id="tab-login" onclick="switchMode('login')" type="button">
          Ingresar
        </button>
<button class="relative z-10 flex-1 py-2 text-center font-label-md text-label-md rounded-md transition-all duration-200 text-text-secondary hover:text-text-primary" id="tab-register" onclick="switchMode('register')" type="button">
          Crear cuenta
        </button>
</div>
<!-- Auth Form -->
<form class="flex flex-col gap-space-sm" id="auth-form" onsubmit="event.preventDefault(); simulateAuth();">
<!-- Registration Fields (Hidden initially) -->
<div class="hidden flex-col gap-1.5" id="field-name" data-register-step="0">
<label class="font-label-md text-label-md text-text-primary">Hola, ¿cómo te llamas?</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-text-muted text-lg pointer-events-none">person</span>
<input class="w-full bg-surface-container-low pl-10 pr-4 py-3 rounded-lg font-body-md text-body-md text-text-primary placeholder:text-text-muted outline-none focus:bg-surface-white focus:shadow-md transition-all duration-150" id="input-name" autocomplete="name" maxlength="80" placeholder="Escribe tu nombre" type="text">
</div>
</div>
<div class="hidden flex-col gap-1.5" id="field-age" data-register-step="1">
<label class="font-label-md text-label-md text-text-primary" for="input-age">¿Cuántos años tienes?</label>
<div class="relative flex items-center"><span class="material-symbols-outlined absolute left-3 text-text-muted text-lg pointer-events-none">cake</span><input class="w-full bg-surface-container-low pl-10 pr-4 py-3 rounded-lg font-body-md text-body-md text-text-primary outline-none focus:bg-surface-white focus:shadow-md transition-all duration-150" id="input-age" min="13" max="120" inputmode="numeric" placeholder="Tu edad" type="number"></div>
</div>
<div class="hidden flex-col gap-1.5" id="field-currency" data-register-step="2">
<label class="font-label-md text-label-md text-text-primary" for="input-currency">¿Cuál es la moneda que utilizarás?</label>
<select class="w-full bg-surface-container-low px-4 py-3 rounded-lg font-body-md text-body-md text-text-primary outline-none focus:bg-surface-white focus:shadow-md transition-all duration-150" id="input-currency"><option value="GTQ">Quetzal guatemalteco (Q)</option><option value="USD">Dólar estadounidense ($)</option><option value="EUR">Euro (€)</option></select>
</div>
<div class="hidden flex-col gap-1.5" id="field-categories" data-register-step="3">
<label class="font-label-md text-label-md text-text-primary">¿En qué categorías repartirás tus gastos?</label>
<p class="font-caption text-caption text-text-secondary">Elige todas las que quieras. Puedes cambiarlas más adelante.</p>
<div class="category-picker" id="category-picker" aria-label="Categorías de gastos">
<button class="category-option" type="button" data-category="Comida" aria-pressed="false">🍽️ Comida</button>
<button class="category-option" type="button" data-category="Ahorros" aria-pressed="false">🐷 Ahorros</button>
<button class="category-option" type="button" data-category="Suscripciones" aria-pressed="false">📱 Suscripciones</button>
<button class="category-option" type="button" data-category="Gastos personales" aria-pressed="false">🛍️ Gastos personales</button>
</div>
<div class="flex gap-2"><input class="w-full bg-surface-container-low px-3 py-2 rounded-lg font-body-md text-body-md text-text-primary placeholder:text-text-muted outline-none focus:bg-surface-white focus:shadow-md" id="input-other-category" maxlength="40" placeholder="Escribe otra categoría" type="text"><button class="py-2 px-3 rounded-lg bg-secondary-fixed text-on-secondary-fixed-variant font-label-md text-label-md" id="btn-add-category" onclick="addOtherCategory()" type="button">Agregar otro</button></div>
<div class="hidden flex flex-wrap gap-2" id="custom-category-picker"></div>
</div>
<div class="flex flex-col gap-space-sm" id="credentials-fields" data-register-step="4">
<!-- Email Field -->
<div class="flex flex-col gap-1.5" data-auth-field>
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-text-primary">Correo electrónico</label>
<span class="hidden text-mint-success font-caption text-caption items-center gap-0.5" id="email-badge">
<span class="material-symbols-outlined text-xs">check_circle</span> Válido · Datos protegidos
            </span>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-text-muted text-lg pointer-events-none">alternate_email</span>
<input class="w-full bg-surface-container-low pl-10 pr-4 py-3 rounded-lg font-body-md text-body-md text-text-primary placeholder:text-text-muted outline-none focus:bg-surface-white focus:shadow-md transition-all duration-150" id="input-email" oninput="checkEmail(this.value)" placeholder="tu@correo.com" required="" type="email">
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-1.5" data-auth-field>
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-text-primary">Contraseña</label>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-text-muted text-lg pointer-events-none">lock</span>
<input class="w-full bg-surface-container-low pl-10 pr-10 py-3 rounded-lg font-body-md text-body-md text-text-primary placeholder:text-text-muted outline-none focus:bg-surface-white focus:shadow-md transition-all duration-150" id="input-password" placeholder="••••••••" required="" type="password">
<button class="absolute right-3 text-text-muted hover:text-text-primary p-1" onclick="togglePasswordVisibility('input-password', 'eye-icon')" type="button">
<span class="material-symbols-outlined text-lg" id="eye-icon">visibility</span>
</button>
</div>
</div>
<!-- Confirm Password Field (Registration only) -->
<div class="hidden flex-col gap-1.5" id="field-confirm" data-auth-field>
<label class="font-label-md text-label-md text-text-primary">Confirma tu contraseña</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-text-muted text-lg pointer-events-none">verified_user</span>
<input class="w-full bg-surface-container-low pl-10 pr-10 py-3 rounded-lg font-body-md text-body-md text-text-primary placeholder:text-text-muted outline-none focus:bg-surface-white focus:shadow-md transition-all duration-150" id="input-confirm" placeholder="••••••••" type="password">
<button class="absolute right-3 text-text-muted hover:text-text-primary p-1" onclick="togglePasswordVisibility('input-confirm', 'confirm-eye-icon')" type="button">
<span class="material-symbols-outlined text-lg" id="confirm-eye-icon">visibility</span>
</button>
</div>
</div>
</div>
<div class="hidden items-center justify-between gap-3" id="register-step-controls"><button class="py-2 px-3 rounded-lg text-text-secondary hover:bg-surface-container-low" id="btn-back" onclick="previousRegisterStep()" type="button">Volver</button><span class="font-caption text-caption text-text-secondary" id="step-label">Paso 1 de 5</span></div>
<!-- Primary Submit Button -->
<button class="w-full mt-space-xs py-3.5 px-space-md rounded-lg bg-primary text-on-primary font-body-md-medium text-body-md-medium shadow-md hover:bg-primary-container active:scale-[0.99] transition-all flex items-center justify-center gap-2" id="btn-submit" type="submit"><span class="">Entrar a Kudo</span><span class="material-symbols-outlined text-base">arrow_forward</span></button>
</form>
<!-- Visible in-page notification -->
<div aria-atomic="true" aria-live="assertive" class="hidden fixed z-[100] top-4 left-1/2 -translate-x-1/2 w-[calc(100%-2rem)] max-w-md rounded-xl border border-outline-variant/40 bg-surface-white px-4 py-3 shadow-2xl items-start gap-3" id="toast-delight" role="alert">
<div class="w-9 h-9 shrink-0 rounded-full bg-secondary-fixed/60 flex items-center justify-center text-secondary"><span class="material-symbols-outlined text-lg" id="toast-icon">notifications</span></div>
<div class="flex-1 min-w-0"><p class="font-label-md text-label-md text-text-primary" id="toast-title">Notificación</p><p class="font-caption text-caption text-text-secondary" id="toast-message"></p></div>
<button aria-label="Cerrar notificación" class="shrink-0 text-text-secondary hover:text-text-primary" onclick="hideNotification()" type="button"><span class="material-symbols-outlined text-lg">close</span></button>
</div>
</div>
</div>
</div>
<script>
  let currentMode = 'login';
  let registerStep = 0;
  const selectedCategories = [];

  function toggleCategory(button) {
    const category = button.dataset.category;
    const index = selectedCategories.indexOf(category);
    if (index >= 0) selectedCategories.splice(index, 1); else selectedCategories.push(category);
    button.classList.toggle('selected', index < 0);
    button.setAttribute('aria-pressed', String(index < 0));
  }

  document.getElementById('category-picker').addEventListener('click', event => {
    const button = event.target.closest('.category-option');
    if (button) toggleCategory(button);
  });

  document.getElementById('custom-category-picker').addEventListener('click', event => {
    const button = event.target.closest('.category-option');
    if (button) toggleCategory(button);
  });

  function addOtherCategory() {
    const input = document.getElementById('input-other-category');
    const category = input.value.trim();
    if (!category) { input.focus(); return; }
    if (category.length < 2 || category.length > 40) { showNotification('La categoría debe tener entre 2 y 40 caracteres.', 'error'); return; }
    if ([...document.querySelectorAll('.category-option')].some(button => button.dataset.category.toLowerCase() === category.toLowerCase())) {
      showNotification('Esa categoría ya está en la lista.', 'info'); return;
    }
    const button = document.createElement('button');
    button.type = 'button'; button.className = 'category-option'; button.dataset.category = category;
    button.setAttribute('aria-pressed', 'false'); button.textContent = `＋ ${category}`;
    document.getElementById('custom-category-picker').appendChild(button);
    document.getElementById('custom-category-picker').classList.remove('hidden');
    document.getElementById('custom-category-picker').classList.add('flex');
    input.value = '';
    toggleCategory(button);
  }

  function showRegisterStep() {
    const names = ['field-name', 'field-age', 'field-currency', 'field-categories', 'credentials-fields'];
    names.forEach((id, index) => {
      const section = document.getElementById(id);
      section.classList.toggle('hidden', index !== registerStep);
      section.classList.toggle('flex', index === registerStep);
    });
    document.getElementById('register-step-controls').classList.remove('hidden');
    document.getElementById('register-step-controls').classList.add('flex');
    document.getElementById('btn-back').classList.toggle('invisible', registerStep === 0);
    document.getElementById('step-label').textContent = `Paso ${registerStep + 1} de 5`;
    document.getElementById('btn-submit').innerHTML = registerStep < 4
      ? '<span>Continuar</span><span class="material-symbols-outlined text-base">arrow_forward</span>'
      : '<span>Crear cuenta</span><span class="material-symbols-outlined text-base">person_add</span>';

    document.getElementById('input-name').required = registerStep === 0;
    document.getElementById('input-age').required = registerStep === 1;
    document.getElementById('input-currency').required = registerStep === 2;
    document.getElementById('input-email').required = registerStep === 4;
    document.getElementById('input-password').required = registerStep === 4;
    document.getElementById('input-confirm').required = registerStep === 4;
  }

  function previousRegisterStep() {
    if (registerStep > 0) { registerStep -= 1; showRegisterStep(); }
  }

  function switchMode(mode) {
    currentMode = mode;
    const tabLogin = document.getElementById('tab-login');
    const tabRegister = document.getElementById('tab-register');
    const fieldName = document.getElementById('field-name');
    const fieldAge = document.getElementById('field-age');
    const fieldCurrency = document.getElementById('field-currency');
    const fieldCategories = document.getElementById('field-categories');
    const credentials = document.getElementById('credentials-fields');
    const fieldConfirm = document.getElementById('field-confirm');
    const controls = document.getElementById('register-step-controls');
    const btnSubmit = document.getElementById('btn-submit');
    const activeClass = 'relative z-10 flex-1 py-2 text-center font-label-md text-label-md rounded-md transition-all duration-200 text-on-primary bg-primary shadow-sm';
    const inactiveClass = 'relative z-10 flex-1 py-2 text-center font-label-md text-label-md rounded-md transition-all duration-200 text-text-secondary hover:text-text-primary';

    if (mode === 'register') {
      tabRegister.className = activeClass;
      tabLogin.className = inactiveClass;
      fieldConfirm.classList.remove('hidden'); fieldConfirm.classList.add('flex');
      registerStep = 0;
      showRegisterStep();
    } else {
      tabLogin.className = activeClass;
      tabRegister.className = inactiveClass;
      [fieldName, fieldAge, fieldCurrency, fieldCategories, controls].forEach(el => { el.classList.add('hidden'); el.classList.remove('flex'); });
      credentials.classList.remove('hidden'); credentials.classList.add('flex');
      fieldConfirm.classList.add('hidden'); fieldConfirm.classList.remove('flex');
      document.getElementById('input-name').required = false;
      document.getElementById('input-age').required = false;
      document.getElementById('input-currency').required = false;
      document.getElementById('input-email').required = true;
      document.getElementById('input-password').required = true;
      document.getElementById('input-confirm').required = false;
      btnSubmit.innerHTML = '<span>Ingresar a KUDO</span><span class="material-symbols-outlined text-base">arrow_forward</span>';
    }
  }

  function togglePasswordVisibility(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    if (input.type === 'password') {
      input.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      input.type = 'password';
      icon.textContent = 'visibility';
    }
  }

  function checkEmail(val) {
    const badge = document.getElementById('email-badge');
    if (val.includes('@') && val.includes('.')) {
      badge.classList.remove('hidden');
      badge.classList.add('inline-flex');
    } else {
      badge.classList.add('hidden');
      badge.classList.remove('inline-flex');
    }
  }

  let notificationTimer;
  function hideNotification() {
    const toast = document.getElementById('toast-delight');
    toast.classList.add('hidden');
    toast.classList.remove('flex');
  }
  function showNotification(message, type = 'info') {
    const toast = document.getElementById('toast-delight');
    const icon = document.getElementById('toast-icon');
    document.getElementById('toast-title').textContent = type === 'error' ? (currentMode === 'register' ? 'No se pudo crear la cuenta' : 'No se pudo iniciar sesión') : type === 'success' ? 'Listo' : 'Información';
    document.getElementById('toast-message').textContent = message;
    icon.textContent = type === 'error' ? 'error' : type === 'success' ? 'check_circle' : 'notifications';
    toast.classList.remove('hidden');
    toast.classList.add('flex');
    clearTimeout(notificationTimer);
    notificationTimer = setTimeout(hideNotification, 5000);
  }

  async function simulateAuth() {
    if (currentMode === 'register' && registerStep < 4) {
      if (registerStep < 3) {
        const currentInput = document.getElementById(['input-name', 'input-age', 'input-currency'][registerStep]);
        if (!currentInput.reportValidity()) return;
      } else if (selectedCategories.length === 0) {
        showNotification('Selecciona al menos una categoría de gastos.', 'error');
        return;
      }
      registerStep += 1;
      showRegisterStep();
      if (registerStep === 4) document.getElementById('input-email').focus();
      return;
    }
    const email = document.getElementById('input-email').value.trim();
    const password = document.getElementById('input-password').value;
    const name = document.getElementById('input-name').value.trim();
    const age = Number(document.getElementById('input-age').value);
    const currency = document.getElementById('input-currency').value;
    const confirmation = document.getElementById('input-confirm').value;
    if (currentMode === 'register' && password !== confirmation) {
      showNotification('Las contraseñas no coinciden.', 'error');
      return;
    }
    try {
      const response = await fetch(`/api/auth/${currentMode === 'register' ? 'register' : 'login'}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(currentMode === 'register' ? { name, age, currency, expenseCategories: selectedCategories, email, password } : { email, password })
      });
      const data = await response.json();
      if (!response.ok) {
        const message = currentMode === 'login' && response.status === 401
          ? 'Correo o contraseña incorrectos. Si aún no tienes cuenta, selecciona «Crear Cuenta».'
          : (data.message || 'No se pudo completar la solicitud.');
        throw new Error(message);
      }
      localStorage.setItem('kudo-token', data.token);
      if (data.user) {
        localStorage.setItem('kudo-currency', data.user.currency || 'GTQ');
        localStorage.setItem('kudo-user', JSON.stringify(data.user));
        try { window.top.postMessage({ type: 'kudo-auth', user: data.user }, window.location.origin); } catch {}
      }
      showNotification(currentMode === 'register' ? '¡Tu cuenta KUDO está lista!' : '¡Bienvenida a KUDO!', 'success');
      setTimeout(() => { window.top.location.href = '/'; }, 650);
    } catch (error) {
      showNotification(error instanceof Error ? error.message : 'No se pudo conectar con KUDO.', 'error');
    }
  }
</script></main>

</body></html>
