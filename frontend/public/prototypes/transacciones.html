<script>
  let rawAmount = "0.00";
  let currentTxType = "expense";
  let currentCategory = "Comida";
  let currentPayment = "Débito";

  function updateAmountView() {
    const display = document.getElementById("amount-display");
    if (!rawAmount || rawAmount === "0" || rawAmount === "") {
      display.innerText = "0.00";
    } else {
      display.innerText = rawAmount;
    }
  }

  function numpadPress(val) {
    if (rawAmount === "0.00" || rawAmount === "0") {
      rawAmount = val === "." ? "0." : val;
    } else {
      if (val === "." && rawAmount.includes(".")) return;
      // Allow max 2 decimals
      if (rawAmount.includes(".")) {
        const parts = rawAmount.split(".");
        if (parts[1] && parts[1].length >= 2) return;
      }
      rawAmount += val;
    }
    updateAmountView();
  }

  function numpadBackspace() {
    if (rawAmount.length > 0 && rawAmount !== "0.00") {
      rawAmount = rawAmount.slice(0, -1);
      if (rawAmount === "" || rawAmount === "0") rawAmount = "0.00";
    } else {
      rawAmount = "0.00";
    }
    updateAmountView();
  }

  function setTxType(type) {
    currentTxType = type;
    const btnExpense = document.getElementById("btn-tab-expense");
    const btnIncome = document.getElementById("btn-tab-income");
    const amountInsight = document.getElementById("amount-insight");

    if (type === "expense") {
      btnExpense.className = "flex items-center gap-1.5 px-space-md py-1.5 rounded-full font-label-md text-label-md transition-all duration-200 bg-primary text-on-primary shadow-sm";
      btnIncome.className = "flex items-center gap-1.5 px-space-md py-1.5 rounded-full font-label-md text-label-md transition-all duration-200 text-text-secondary hover:text-text-primary";
      amountInsight.innerHTML = '<span class="w-2 h-2 rounded-full bg-mint-success"></span><span class="font-caption text-caption">Dentro de tu presupuesto semanal</span>';
    } else {
      btnIncome.className = "flex items-center gap-1.5 px-space-md py-1.5 rounded-full font-label-md text-label-md transition-all duration-200 bg-secondary text-on-secondary shadow-sm";
      btnExpense.className = "flex items-center gap-1.5 px-space-md py-1.5 rounded-full font-label-md text-label-md transition-all duration-200 text-text-secondary hover:text-text-primary";
      amountInsight.innerHTML = '<span class="w-2 h-2 rounded-full bg-secondary"></span><span class="font-caption text-caption">Suma a tu meta de ahorro mensual</span>';
    }
  }

  function selectCategory(el, name, icon) {
    currentCategory = name;
    const buttons = document.querySelectorAll(".cat-pill");
    buttons.forEach((btn) => {
      btn.className = "cat-pill flex-shrink-0 flex items-center gap-2 px-3 py-2 rounded-xl bg-surface-white text-text-primary shadow-sm transition-transform active:scale-95";
      const iconContainer = btn.querySelector("span");
      if (iconContainer) {
        iconContainer.className = "w-7 h-7 rounded-lg bg-surface-container flex items-center justify-center text-text-secondary";
      }
    });

    el.className = "cat-pill flex-shrink-0 flex items-center gap-2 px-3 py-2 rounded-xl bg-primary text-on-primary shadow-sm transition-transform active:scale-95";
    const activeIconContainer = el.querySelector("span");
    if (activeIconContainer) {
      activeIconContainer.className = "w-7 h-7 rounded-lg bg-surface-white/15 flex items-center justify-center text-on-primary";
    }
  }

  function selectPayment(el) {
    currentPayment = el.innerText.trim();
    const opts = document.querySelectorAll(".pay-option");
    opts.forEach((btn) => {
      btn.className = "pay-option font-caption-caps text-caption-caps py-2 rounded-md text-text-secondary hover:text-text-primary text-center";
    });
    el.className = "pay-option font-caption-caps text-caption-caps py-2 rounded-md bg-surface-white text-text-primary shadow-sm text-center";
  }

  function attachReceipt() {
    const label = document.getElementById("receipt-label");
    const btn = document.getElementById("btn-receipt");
    label.innerText = "recibo_1204.jpg";
    label.className = "font-body-md-medium text-body-md-medium text-secondary truncate";
    btn.className = "flex items-center justify-between bg-secondary-fixed/20 px-3 py-2.5 rounded-lg text-left transition-colors";
  }

  async function submitTransaction() {
    const token = localStorage.getItem('kudo-token');
    if (!token) { window.top.location.href = '/login'; return; }
    const concept = document.getElementById('concept-input').value.trim();
    const submitBtn = document.getElementById("btn-submit");
    const btnText = document.getElementById("btn-submit-text");
    if (!Number.isFinite(Number(rawAmount)) || Number(rawAmount) <= 0) {
      btnText.innerText = 'Ingresa un monto mayor que cero';
      setTimeout(() => { btnText.innerText = 'Guardar Movimiento'; }, 2500);
      return;
    }
    submitBtn.disabled = true;
    btnText.innerText = 'Guardando...';
    try {
      const response = await fetch('/api/transactions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({ title: concept || currentCategory, category: currentCategory,
          type: currentTxType === 'expense' ? 'EXPENSE' : 'INCOME', amount: Number(rawAmount),
          date: new Date().toISOString(), paymentMethod: currentPayment })
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.message || 'No se pudo guardar el movimiento.');
      submitBtn.classList.remove('bg-primary');
      submitBtn.classList.add('bg-mint-success');
      submitBtn.classList.replace('text-on-primary', 'text-text-primary');
      btnText.innerText = currentTxType === 'expense' ? '✓ ¡Gasto registrado con éxito!' : '✓ ¡Ingreso guardado con éxito!';
      setTimeout(() => { window.top.location.href = '/'; }, 650);
    } catch (error) {
      btnText.innerText = error instanceof Error ? error.message : 'Error al guardar';
      submitBtn.disabled = false;
    }
    return;

  }

  // Initialize display
  updateAmountView();
</script></main>

</body></html>
