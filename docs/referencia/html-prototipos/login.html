</button>

<!-- Confirm Password Field (Registration only) -->

<label class="font-label-md text-label-md text-text-primary">Confirma tu contraseña</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-text-muted text-lg pointer-events-none">verified_user</span>
<input class="w-full bg-surface-container-low pl-10 pr-10 py-3 rounded-lg font-body-md text-body-md text-text-primary placeholder:text-text-muted outline-none focus:bg-surface-white focus:shadow-md transition-all duration-150" id="input-confirm" placeholder="••••••••" type="password">
<button class="absolute right-3 text-text-muted hover:text-text-primary p-1" onclick="togglePasswordVisibility('input-confirm', 'confirm-eye-icon')" type="button">

<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"></path>

<script>
  let currentMode = 'login';

  function switchMode(mode) {
    currentMode = mode;
    const tabLogin = document.getElementById('tab-login');
    const tabRegister = document.getElementById('tab-register');
    const fieldName = document.getElementById('field-name');
    const fieldConfirm = document.getElementById('field-confirm');
    const linkForgot = document.getElementById('link-forgot');
    const btnSubmit = document.getElementById('btn-submit');
    const biometricBox = document.getElementById('biometric-box');
    const greetingTitle = document.getElementById('greeting-title');
    const greetingDesc = document.getElementById('greeting-desc');

    if (mode === 'register') {
      tabRegister.className = 'relative z-10 flex-1 py-2 text-center font-label-md text-label-md rounded-md transition-all duration-200 text-on-primary bg-primary shadow-sm';
      tabLogin.className = 'relative z-10 flex-1 py-2 text-center font-label-md text-label-md rounded-md transition-all duration-200 text-text-secondary hover:text-text-primary';
      
      fieldName.classList.remove('hidden');
      fieldName.classList.add('flex');
      fieldConfirm.classList.remove('hidden');
      fieldConfirm.classList.add('flex');
      
      linkForgot.classList.add('invisible');
      biometricBox.classList.add('hidden');
      
      btnSubmit.innerHTML = `<span>Crear mi cuenta gratis</span><span class="material-symbols-outlined text-base">sparkles</span>`;
      greetingTitle.textContent = 'Empieza tu libertad financiera';
      greetingDesc.textContent = 'En menos de 2 minutos tendrás tu asistente activo.';
    } else {
      tabLogin.className = 'relative z-10 flex-1 py-2 text-center font-label-md text-label-md rounded-md transition-all duration-200 text-on-primary bg-primary shadow-sm';
      tabRegister.className = 'relative z-10 flex-1 py-2 text-center font-label-md text-label-md rounded-md transition-all duration-200 text-text-secondary hover:text-text-primary';
      
      fieldName.classList.add('hidden');
      fieldName.classList.remove('flex');
      fieldConfirm.classList.add('hidden');
      fieldConfirm.classList.remove('flex');
      
      linkForgot.classList.remove('invisible');
      biometricBox.classList.remove('hidden');
      
      btnSubmit.innerHTML = `<span>Entrar a Finova</span><span class="material-symbols-outlined text-base">arrow_forward</span>`;
      greetingTitle.textContent = '¡Hola de nuevo!';
      greetingDesc.textContent = 'Tus presupuestos y metas de mayo están al día.';
    }
  }

  function togglePasswordVisibility(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    if (input.type === 'password') {
      input.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      input.type = 'password';
      icon.textContent = 'visibility';
    }
  }

  function checkEmail(val) {
    const badge = document.getElementById('email-badge');
    if (val.includes('@') && val.includes('.')) {
      badge.classList.remove('hidden');
      badge.classList.add('inline-flex');
    } else {
      badge.classList.add('hidden');
      badge.classList.remove('inline-flex');
    }
  }

  function triggerBiometric() {
    const toast = document.getElementById('toast-delight');
    toast.classList.remove('hidden');
    toast.classList.add('flex');
    setTimeout(() => {
      toast.classList.add('hidden');
      toast.classList.remove('flex');
    }, 2500);
  }

  function simulateAuth() {
    triggerBiometric();
  }
</script></main>
