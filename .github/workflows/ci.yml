name: CI

on:
  push:
    branches: [main, prepare-kudo-proyecto1]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kudo
      POSTGRES_PASSWORD: kudo_ci_local
          POSTGRES_DB: kudo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kudo -d kudo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://kudo:kudo_ci_local@localhost:5432/kudo?schema=public
      JWT_SECRET: kudo-ci-test-secret-please-use-only-in-ci-2026
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm ci --prefix backend
      - run: npm run db:generate
      - run: npx prisma migrate deploy --schema backend/prisma/schema.prisma
      - run: npm run build
      - run: npm test
