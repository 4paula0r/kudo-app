name: CI

on:
  push:
    branches: [main, prepare-kudo-proyecto1]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kudo
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: kudo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kudo -d kudo_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://kudo@localhost:5432/kudo_test?schema=public
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm ci --prefix backend
      - run: npm run db:generate
      - run: npx prisma migrate deploy --schema prisma/schema.prisma
        working-directory: backend
      - run: npm run build
      - run: npm test
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run E2E
        run: npm run test:e2e
      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kudo-evidencias-${{ github.run_number }}
          path: docs/evidencias/pruebas
          if-no-files-found: warn